
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>かず · Números</title>

<style>
:root {
  --bg: #f7f3ec;
  --paper: #fffdf9;
  --accent: #7867a8;
  --pink: #e7a1bd;
  --pink2: #eac0da;
  --pale: #ffeef4;
  --ink: #51484d;
  --line: #62575d;
  --muted: #887b82;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 22px;
  background: var(--bg);
  color: var(--ink);
  font-family: Arial, "Noto Sans JP", sans-serif;
}

.page {
  max-width: 1500px;
  margin: auto;
  padding: 22px;
  background: var(--paper);
  border: 3px solid var(--line);
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 4px solid var(--pink);
  padding-bottom: 14px;
  margin-bottom: 20px;
}

h1 {
  margin: 0;
  color: #8e5871;
  font-size: clamp(28px, 4vw, 42px);
  letter-spacing: 2px;
}

.subtitle {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 14px;
}

.layout {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 20px;
  align-items: start;
}

.charts {
  display: grid;
  gap: 16px;
}

.sheet-section {
  border: 2px solid var(--line);
  background: white;
  padding: 12px;
}

.section-title {
  margin: -12px -12px 12px;
  padding: 8px 12px;
  background: var(--pink2);
  font-size: 17px;
  color: #59434e;
}

.jp {
  font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
}

.word-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  border-top: 1px solid var(--line);
  border-left: 1px solid var(--line);
}

.word-table th,
.word-table td {
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 10px 7px;
  text-align: center;
  overflow-wrap: anywhere;
}

.word-table th {
  background: var(--pale);
  color: #80536a;
  font-size: 13px;
}

.word-table td {
  background: white;
  font-size: 14px;
}

.word-table tbody tr:nth-child(odd) td {
  background: #fff8fb;
}

.word-table .japanese {
  font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
  font-size: 20px;
  color: #5b4b53;
}

.word-table .romaji {
  color: var(--muted);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .2px;
}

.word-table .spanish {
  color: var(--ink);
}

@media(max-width: 900px) {
  body { padding: 8px; }
  .page { padding: 12px; }
  .layout { grid-template-columns: 1fr; }
}

@media(max-width: 560px) {
  .word-table th,
  .word-table td {
    padding: 8px 4px;
    font-size: 12px;
  }

  .word-table .japanese {
    font-size: 17px;
  }

  .word-table .romaji {
    font-size: 10px;
  }
}

@media print {
  body { padding: 0; background: white; }
  .page { border: 0; max-width: none; }
  .layout { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sheet-section { break-inside: avoid; }
}

nav {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

nav a {
  padding: 9px 14px;
  border: 2px solid var(--pink);
  border-radius: 7px;
  text-decoration: none;
  color: #80536a;
  font-weight: bold;
  background: var(--pale);
}

nav a.active {
  background: var(--pink);
  color: white;
}

@media print { nav { display: none; } }
</style>
</head>

<body>
<div class="page">

<header>

  </div>

  <nav>

    <a href="palabras-katakana.html">Palabras katakana</a>
    <a href="paisesidiomas.html">Países e idiomas</a>
    <a href="profesiones.html">Profesiones</a>
    <a class="active" href="numeros.html">Números</a>
    <a href="hiragana_practice.html">Práctica hiragana</a>
    <a href="katakana_practice.html">Práctica katakana</a>
    <a href="palabras.html">Práctica palabras</a>
  </nav>
</header>

<main class="layout" style="grid-template-columns:minmax(0,720px)">

<table class="word-table">
<thead>
<tr>
  <th>Hiragana</th>
  <th>Rōmaji</th>

</tr>
</thead>
<tbody>
<tr><td class="japanese">いち</td><td class="romaji">ichi</td><td class="romaji">1</td><td class="spanish">Uno</td></tr>

<tr><td class="japanese">ご</td><td class="romaji">go</td><td class="romaji">5</td><td class="spanish">Cinco</td></tr>
</tbody>
</table>
</section>

</div>

</main>

</div>
</body>
</html>
